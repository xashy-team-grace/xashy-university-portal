# File: .github/workflows/Build_SCA_SAST.yaml

name: Build, SCA, SAST Pipeline

on:
  push:
    branches:
      - fomo-actions

jobs:
  # ============================================
  # JOB 1: Build and Testing
  # ============================================
  build-and-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: xashy-team-grace/xashy-university-portal

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./
        run: mvn -B clean verify --file pom.xml

  # ============================================
  # JOB 2: Software Composition Analysis (SCA)
  # ============================================
  software-composition-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: xashy-team-grace/xashy-university-portal

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan SBOM with Grype
        run: >
          curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b /usr/local/bin
          grype --fail-on low sbom:sbom.spdx.json

        

  # ============================================
  # JOB 3: Upload Artifact (only if Grype found nothing)
  # ============================================
  upload-artifact:
    runs-on: ubuntu-latest
    needs: [build-and-testing, software-composition-analysis]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: xashy-team-grace/xashy-university-portal

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: ./app/target/*.war
          if-no-files-found: error

  # ============================================
  # JOB 4: SAST with SonarQube
  # ============================================
  sast-sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: xashy-team-grace/xashy-university-portal
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run SonarQube Analysis
        working-directory:
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
         mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar